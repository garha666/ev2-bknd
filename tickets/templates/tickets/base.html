<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Plataforma de Entradas{% endblock %}</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        main {
            flex: 1;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }
        h1 { margin-top: 0; font-size: 2rem; }
        p { color: var(--muted); line-height: 1.6; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .card {
            background: var(--panel);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 1.5rem;
        }
        code {
            background: #0b1220;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .site-footer {
            border-top: 1px solid #334155;
            background: #0b1220;
            text-align: center;
            padding: 1.25rem 1rem;
            font-size: 0.9rem;
        }
        .site-footer p { margin: 0.2rem 0; color: var(--muted); }
        .site-footer strong { color: var(--text); }
    </style>
</head>
<body>
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer obligatorio EVA-2: Nombre Completo, Sección y Año -->
    <footer class="site-footer">
        <p><strong>{{ alumno_nombre }}</strong></p>
        <p>Sección {{ alumno_seccion }} &middot; Año {{ alumno_anio }}</p>
    </footer>
</body>
</html>
